<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Central de qualificação de leads imobiliários da MySide." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Central de Qualificação de Leads — MySide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Depois de um novo deploy o navegador pode reaproveitar um index.html antigo
      // que aponta para um bundle que nao existe mais, deixando a pagina em branco.
      // Se algum script ou estilo falhar ao carregar, recarrega uma unica vez.
      (function () {
        var CHAVE = "recarregou-assets";
        window.addEventListener(
          "error",
          function (evento) {
            var alvo = evento.target;
            if (!alvo || (alvo.tagName !== "SCRIPT" && alvo.tagName !== "LINK")) return;
            var ultimo = Number(sessionStorage.getItem(CHAVE) || 0);
            if (Date.now() - ultimo < 30000) return;
            sessionStorage.setItem(CHAVE, String(Date.now()));
            location.reload();
          },
          true,
        );
      })();
    </script>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
